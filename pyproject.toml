[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# shortcut: only errors that break at runtime (syntax, undefined names). The old
# E/F/I/N/W/UP set flags ~900 style issues; widen once the code is formatted.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

